services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-agent-api}:${IMAGE_TAG:-latest}
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - .:/app
    environment:
      AGNO_MONITOR: "True"
      AGNO_API_KEY: ${AGNO_API_KEY}
      DB_HOST: pg15-prod-rw.wallety.pg.db-eu2.zcloud.ws
      DB_PORT: 60421
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME}
      WAIT_FOR_DB: "True"
      PRINT_ENV_ON_LOAD: "True"
    networks:
      - agno-agent-api
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  agno-agent-api:

volumes:
  pgdata:
